<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Chat PRO</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0a0a0a;
    color:white;
    text-align:center;
}

/* RGB ARCOIRIS */
@keyframes rgbGlow {
0%{box-shadow:0 0 10px red;}
25%{box-shadow:0 0 10px yellow;}
50%{box-shadow:0 0 10px cyan;}
75%{box-shadow:0 0 10px magenta;}
100%{box-shadow:0 0 10px red;}
}

.container{
    margin-top:40px;
}

input{
    padding:10px;
    margin:5px;
    border:2px solid cyan;
    border-radius:5px;
    background:#111;
    color:white;
}

button{
    padding:10px 20px;
    margin:5px;
    border-radius:5px;
    border:none;
    background:#111;
    color:cyan;
    cursor:pointer;
    font-weight:bold;
    animation: rgbGlow 4s infinite linear;
}

.chat-wrapper{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:20px;
}

.chat-box{
    width:60%;
    height:350px;
    background:#111;
    overflow-y:auto;
    padding:10px;
    border-radius:10px;
    border:2px solid cyan;
}

.users-box{
    width:20%;
    height:350px;
    background:#111;
    overflow-y:auto;
    border-radius:10px;
    border:2px solid magenta;
    padding:10px;
}

.message{
    text-align:left;
    margin:5px 0;
}
</style>
</head>
<body>

<div id="login" class="container">
    <h2>🌈 Neon Chat PRO</h2>
    <input type="text" id="username" placeholder="Tu nombre">
    <input type="number" id="server" placeholder="Número servidor">
    <br>
    <button onclick="joinServer()">Entrar</button>
</div>

<div id="chatUI" style="display:none;">
    <h2 id="serverTitle"></h2>

    <div class="chat-wrapper">
        <div class="chat-box" id="chatBox"></div>
        <div class="users-box" id="usersBox">
            <h4>Usuarios</h4>
        </div>
    </div>

    <br>
    <input type="text" id="messageInput" placeholder="Escribe mensaje">
    <button onclick="sendMessage()">Enviar</button>
</div>

<audio id="msgSound">
<source src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg">
</audio>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
// 🔥 PEGA TU CONFIG REAL AQUÍ
var firebaseConfig = {
  apiKey: "PEGA_AQUI",
  authDomain: "PEGA_AQUI",
  databaseURL: "PEGA_AQUI",
  projectId: "PEGA_AQUI",
  storageBucket: "PEGA_AQUI",
  messagingSenderId: "PEGA_AQUI",
  appId: "PEGA_AQUI"
};

firebase.initializeApp(firebaseConfig);
var database = firebase.database();

let currentUser="";
let currentServer="";
let userRef="";

function joinServer(){
    currentUser=document.getElementById("username").value.trim();
    let serverNumber=document.getElementById("server").value.trim();

    if(!currentUser || !serverNumber){
        alert("Completa todos los campos");
        return;
    }

    currentServer="servers/"+serverNumber;
    userRef=currentServer+"/users/"+currentUser;

    document.getElementById("login").style.display="none";
    document.getElementById("chatUI").style.display="block";
    document.getElementById("serverTitle").innerText="Servidor #"+serverNumber;

    database.ref(userRef).set(true);
    database.ref(userRef).onDisconnect().remove();

    listenMessages();
    listenUsers();
}

function sendMessage(){
    let msg=document.getElementById("messageInput").value.trim();
    if(msg==="") return;

    database.ref(currentServer+"/messages").push({
        user:currentUser,
        text:msg,
        time:Date.now()
    });

    document.getElementById("messageInput").value="";
}

function listenMessages(){
    database.ref(currentServer+"/messages")
    .limitToLast(100)
    .on("child_added", function(snapshot){
        let data=snapshot.val();
        let chatBox=document.getElementById("chatBox");

        chatBox.innerHTML+=
        "<div class='message'><b>"+data.user+":</b> "+data.text+"</div>";

        chatBox.scrollTop=chatBox.scrollHeight;
        document.getElementById("msgSound").play();
    });
}

function listenUsers(){
    database.ref(currentServer+"/users")
    .on("value", function(snapshot){
        let usersBox=document.getElementById("usersBox");
        usersBox.innerHTML="<h4>Usuarios</h4>";

        snapshot.forEach(function(child){
            usersBox.innerHTML+="<div>"+child.key+"</div>";
        });
    });
}
</script>

</body>
  </html>
